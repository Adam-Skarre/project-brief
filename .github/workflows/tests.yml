name: tests
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python eval_rag.py
      - name: Development retrieval regression gate
        run: python -c "import json; rows=json.load(open('evaluation/retrieval_results.json'))['results']; assert all(r['mrr'] >= 0.35 for r in rows)"
